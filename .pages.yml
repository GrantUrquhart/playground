media:
  input: src/assets/images
  output: /src/assets/images
content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    view:
      fields: [title, pubDate, author]
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: author
        label: Author
        type: string

      - name: description
        label: Description
        type: text

      - name: image
        label: Featured Image
        type: image

      - name: pubDate
        label: Publish Date
        type: date

      - name: tags
        label: Tags
        type: string
        list: true

      - name: body
        label: Content
        type: rich-text